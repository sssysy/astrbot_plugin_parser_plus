<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ card.platform.display_name }} · 卡片</title>
  <style data-style="icon">{{ styles["icon.css"] | safe }}</style>
  <style data-style="tailwind">{{ styles["tailwind.css"] | safe }}</style>
  {% from "macros.html" import resolve_cover_src, render_ambient, render_content %}
  <style>
    /* 本插件以 1000px 画布截屏，lite 版式为 620px，这里等比放大后再截图。 */
    html, body { margin: 0; padding: 0; background: #f8fafc; }
    body { width: 1000px; }
    main {
      zoom: 1.6129032258064516;
      transform-origin: 0 0;
    }
    /* 图片必须按原始比例占位，禁止参与百分比高度解析，避免超长画布。 */
    main img { height: auto; }
    main .single-image img { height: auto; width: 100%; }
    main .aspect-square img { height: 100%; }
    /* 光晕层是定位副本，不能撑开容器。 */
    main .single-image { height: auto; }
    main .single-image > img { display: block; }
    /* 光晕副本只做装饰：跟随前景宽度，高度由图片比例决定。 */
    main .media-glow {
      inset: 6% 6% auto 6%;
      width: 88%;
      height: auto;
      transform: translateY(14px) scale(1.02);
    }
  </style>
</head>
<body class="m-0 w-[1000px] break-all font-sans antialiased">
  {% set cover_src = resolve_cover_src(card) %}
  {% set logo_src = card.platform.logo %}
  <main class="relative isolate w-[620px] overflow-hidden bg-slate-50 rounded-2xl dark:bg-slate-950">
    {{ render_ambient(cover_src, logo_src) }}
    <div class="relative z-[1]">{{ render_content(card, meta) }}</div>
  </main>
</body>
</html>
